[package]
name = "montycat"
version = "0.2.0"
edition = "2024"

authors = ["MontyGovernance"]
description = "Rust client for Montycat - the self-hosted NoSQL + vector database with built-in AI semantic search for RAG & AI agents. The fastest, safest, and most elegant database client ever built in Rust."
license = "MIT OR Apache-2.0"
readme = "README.md"

documentation = "https://docs.rs/montycat"
homepage = "https://montygovernance.com"

keywords = ["vector-database", "semantic-search", "rag", "embeddings", "nosql"]
categories = ["database", "asynchronous", "network-programming", "api-bindings"]

[dependencies]
serde = {version = "1", features = ["derive"]}
url = "2.5.8"
serde_json = "1"
tokio = { version = "1", features = ["full", "io-util"] }
simd-json = { version = "0.17.3", features = ["serde_impl"] }
indexmap = { version = "2.14.0", features = ["serde"] }
async-trait = "0.1.88"
xxhash-rust = { version = "0.8.16", features = ["xxh32"]}
rayon = "1.12.0"
montycat_serialization_derive = "0.1.7"


# Optional TLS
tokio-rustls = { version = "0.26", optional = true }
rustls-pki-types = { version = "1.15.0", optional = true }
webpki-roots = { version = "1.0.8", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
tls = ["tokio-rustls", "rustls-pki-types", "webpki-roots"]